name: Hourly Whale Tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-whale-tracker
  cancel-in-progress: true

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tracker
        run: python run_once.py

      - name: Run market context
        run: python market_context.py
        continue-on-error: true

      - name: Run native HL insights
        run: python hyperliquid_native_insights.py
        continue-on-error: true

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json \
                  data/whale_snapshots.csv \
                  data/market_context.json \
                  data/market_context_history.json \
                  data/hl_native_insights.json || true
          git diff --cached --quiet || git commit -m "chore: update tracker data"
          git push
