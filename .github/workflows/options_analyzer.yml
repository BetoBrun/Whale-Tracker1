name: Options Analyzer (1h)

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Ensure directory exists
        run: mkdir -p data logs
      
      - name: Run options analyzer
        run: python options_analyzer.py
        continue-on-error: true
      
      - name: Validate output
        run: |
          python << 'EOF'
          import json
          import sys
          
          try:
              with open('data/options_data.json') as f:
                  data = json.load(f)
                  btc_ok = data.get('BTC', {}).get('status') == 'ok'
                  eth_ok = data.get('ETH', {}).get('status') == 'ok'
                  print(f"BTC: {'✓' if btc_ok else '✗'}")
                  print(f"ETH: {'✓' if eth_ok else '✗'}")
                  
                  if not btc_ok and not eth_ok:
                      print("WARNING: Both currencies failed")
                      # Don't fail, fallback should exist
                  else:
                      print("Validation: OK")
          except Exception as e:
              print(f"Error: {e}")
              # Create minimal valid file
              import json
              from datetime import datetime
              minimal = {
                  "schema_version": "2.0.0",
                  "generated_at": datetime.utcnow().isoformat(),
                  "status": "error",
                  "BTC": {"status": "error", "error": str(e), "spot_price": 0, "by_expiry": {}},
                  "ETH": {"status": "error", "error": str(e), "spot_price": 0, "by_expiry": {}}
              }
              with open('data/options_data.json', 'w') as f:
                  json.dump(minimal, f, indent=2)
              print("Created minimal fallback file")
          EOF
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/options_data.json logs/ || true
          git diff --cached --quiet || git commit -m "options: $(date -u +'%H:%M') UTC"
          git push || true
