name: Spike Monitor (10min)

on:
  schedule:
    - cron: "0,10,20,30,40,50 * * * *"
  workflow_dispatch:

jobs:
  spike-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure fallback files
        run: |
          mkdir -p data logs
          [ -f data/spike_alerts.json ] || echo '[]' > data/spike_alerts.json
          [ -f data/spike_state.json ] || echo '{"timestamp":"'$(date -u +%Y-%m-%d\ %H:%M:%S)'","addresses":[],"positions":{}}' > data/spike_state.json

      - name: Run spike monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python spike_monitor.py

      - name: Validate output
        run: python - <<'PY'
import json
with open('data/spike_alerts.json', encoding='utf-8') as f:
    data = json.load(f)
print('events', len(data) if isinstance(data, list) else 0)
PY

      - name: Commit spike data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spike_alerts.json data/spike_state.json logs/*.log || true
          git diff --cached --quiet || git commit -m "spike: $(date -u +'%H:%M') UTC"
          git pull --rebase || true
          git push || true
