name: Spike Monitor (10min)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spike-monitor
  cancel-in-progress: true

jobs:
  spikes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run spike monitor
        run: python spike_monitor.py

      - name: Commit spike data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spike_alerts.json data/spike_state.json || true
          git diff --cached --quiet || git commit -m "chore: update spike data"
          git push
