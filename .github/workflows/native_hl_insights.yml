name: Hyperliquid Native Insights (1h)

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-hl-insights
  cancel-in-progress: true

jobs:
  native-insights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run native HL insights
        run: python hyperliquid_native_insights.py

      - name: Commit HL native insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hl_native_insights.json || true
          git diff --cached --quiet || git commit -m "chore: update HL native insights"
          git push
