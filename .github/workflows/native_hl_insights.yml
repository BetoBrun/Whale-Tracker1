name: Hyperliquid Native Insights (1h)

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  native-insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate native insights
        run: python hyperliquid_native_insights.py

      - name: Commit native insights
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hl_native_insights.json || true
          git diff --cached --quiet || git commit -m "native-insights: $(date -u +'%H:%M') UTC"
          git push
