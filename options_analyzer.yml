
name: Hourly Whale Tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data folders
        run: mkdir -p data logs

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Run market context
        run: python market_context.py
        continue-on-error: true

      - name: Run options analyzer
        run: python options_analyzer.py
        continue-on-error: true

      - name: Validate JSON outputs
        run: |
          python - <<'PY'
          import json, pathlib
          files = [
            'data/alerts.json',
            'data/market_context.json',
            'data/options_data.json',
            'data/spike_alerts.json',
            'data/spike_state.json',
          ]
          for f in files:
            p = pathlib.Path(f)
            if p.exists():
              json.loads(p.read_text(encoding='utf-8'))
              print('OK', f)
          PY

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/whale_snapshots.csv data/alerts.json data/options_data.json data/market_context.json data/market_context_history.json data/spike_alerts.json data/spike_state.json || true
          git add data/last_telegram_signal.json || true
          git add data/snapshot_*.png || true
          git diff --cached --quiet || git commit -m "chore: snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase || true
          git push || true
